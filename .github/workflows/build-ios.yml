      - name: Create IPA
        run: |
          # your existing Create IPA commands here

      - name: Inspect app executable
        run: |
          APP="build/Build/Products/Release-iphoneos/AlienHominid.app"

          echo "=== APP FILES ==="
          find "$APP" -maxdepth 2 -print

          echo "=== INFO PLIST ==="
          /usr/libexec/PlistBuddy -c "Print" "$APP/Info.plist"

          echo "=== EXECUTABLE ==="
          ls -lh "$APP/AlienHominid"

          echo "=== FILE TYPE ==="
          file "$APP/AlienHominid"

          echo "=== ARCHITECTURE ==="
          lipo -info "$APP/AlienHominid"

          echo "=== IPA ==="
          unzip -l AlienHominid.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: AlienHominid-iOS
          path: AlienHominid.ipa
          if-no-files-found: error
