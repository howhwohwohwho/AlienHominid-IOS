name: Build iOS IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build iOS app
        run: |
          xcodebuild \
            -project AlienHominid.xcodeproj \
            -scheme AlienHominid \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            clean build

      - name: Verify app
        run: |
          APP="build/Build/Products/Release-iphoneos/AlienHominid.app"

          if [ ! -d "$APP" ]; then
            echo "ERROR: AlienHominid.app was not created"
            exit 1
          fi

          if [ ! -f "$APP/Info.plist" ]; then
            echo "ERROR: Info.plist is missing"
            exit 1
          fi

          echo "App found:"
          ls -la "$APP"

      - name: Create IPA
        run: |
          APP="build/Build/Products/Release-iphoneos/AlienHominid.app"

          rm -rf Payload AlienHominid.ipa

          mkdir -p Payload

          cp -R "$APP" "Payload/AlienHominid.app"

          echo "Payload structure:"
          find Payload -maxdepth 2 -print

          cd Payload
          zip -r ../AlienHominid.ipa AlienHominid.app
          cd ..

          echo "Final IPA contents:"
          unzip -l AlienHominid.ipa

      - name: Verify IPA Payload
        run: |
          if ! unzip -l AlienHominid.ipa | grep -q "Payload/AlienHominid.app/Info.plist"; then
            echo "ERROR: IPA does not contain Payload/AlienHominid.app/Info.plist"
            exit 1
          fi

          echo "SUCCESS: Valid Payload detected."

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: AlienHominid-iOS
          path: AlienHominid.ipa
          if-no-files-found: error
          
