name: Build iOS IPA

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: xcodegen generate

      - name: Build iOS app
        run: |
          xcodebuild \
            -project AlienHominid.xcodeproj \
            -scheme AlienHominid \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            clean build

      - name: Create IPA
        run: |
          rm -rf Payload AlienHominid.ipa

          mkdir Payload

          cp -R \
            "build/Build/Products/Release-iphoneos/AlienHominid.app" \
            "Payload/AlienHominid.app"

          zip -r AlienHominid.ipa Payload

      - name: Check IPA
        run: |
          unzip -l AlienHominid.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: AlienHominid-iOS
          path: AlienHominid.ipa
          if-no-files-found: error
          
