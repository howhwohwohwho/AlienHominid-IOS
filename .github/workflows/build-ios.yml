name: Build iOS IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build iOS app
        run: |
          xcodebuild \
            -project AlienHominid.xcodeproj \
            -scheme AlienHominid \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            clean build

      - name: Verify app bundle
        run: |
          APP="build/Build/Products/Release-iphoneos/AlienHominid.app"

          echo "Checking app..."
          test -d "$APP"

          echo "Checking Info.plist..."
          test -f "$APP/Info.plist"

          echo "Info.plist:"
          /usr/libexec/PlistBuddy -c "Print" "$APP/Info.plist"

          echo "Bundle:"
          file "$APP/AlienHominid"

      - name: Create IPA
        run: |
          rm -rf Payload AlienHominid.ipa

          mkdir Payload
          cp -R "build/Build/Products/Release-iphoneos/AlienHominid.app" "Payload/"

          /usr/bin/ditto -c -k --sequesterRsrc --keepParent \
            Payload AlienHominid.ipa

          echo "IPA created:"
          ls -lh AlienHominid.ipa

      - name: Verify IPA
        run: |
          unzip -l AlienHominid.ipa | head -50

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: AlienHominid-iOS
          path: AlienHominid.ipa
